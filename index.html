<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablors — Owner Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17241e;--muted:#738078;--line:#e8ece9;--paper:#fff;--bg:#f7f8f6;--olive:#315c43;--lime:#e9f1d8;--amber:#d6902e;--amber-bg:#fff4df;--red:#c94b43;--red-bg:#fdf0ee;--blue:#3b73b9;--blue-bg:#edf5ff;--shadow:0 8px 24px rgba(25,43,33,.055)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:"DM Sans",sans-serif;color:var(--ink);font-size:14px} button{font:inherit;cursor:pointer} .shell{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#fff;border-right:1px solid var(--line);padding:28px 16px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:3}.brand{display:flex;gap:10px;align-items:center;padding:0 12px 28px;font-weight:700;font-size:18px;letter-spacing:-.5px}.brand-mark{width:30px;height:30px;background:var(--olive);border-radius:9px;color:#fff;display:grid;place-items:center;font-family:Georgia;font-size:21px}.brand small{color:var(--muted);font-size:10px;display:block;font-weight:600;letter-spacing:1.5px;margin-top:2px}.nav-label{font-size:10px;color:#96a099;font-weight:700;letter-spacing:1.1px;padding:0 12px 10px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#66746c;text-align:left;padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:12px;font-weight:500}.nav button:hover{background:#f2f5f0}.nav button.active{background:var(--lime);color:var(--olive);font-weight:700}.nav i{font-style:normal;width:17px;text-align:center}.side-card{margin-top:auto;background:#f4f7f1;border:1px solid #e3ebda;border-radius:12px;padding:14px}.side-card b{font-size:12px}.side-card p{font-size:11px;line-height:1.45;color:var(--muted);margin:6px 0 10px}.side-card button{background:none;border:0;padding:0;color:var(--olive);font-size:11px;font-weight:700}
    main{width:calc(100% - 250px);margin-left:250px;padding:0 34px 44px;max-width:1780px}.topbar{height:81px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.restaurant{display:flex;align-items:center;gap:11px}.restaurant-logo{width:36px;height:36px;border-radius:10px;background:#e2eddb;color:var(--olive);display:grid;place-items:center;font-family:Georgia;font-size:22px}.restaurant b{font-size:14px}.restaurant span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.top-actions{display:flex;align-items:center;gap:17px}.clock{font-size:12px;color:var(--muted);font-weight:500}.icon-button{position:relative;border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:10px;color:#5b6961}.dot{position:absolute;width:7px;height:7px;background:var(--red);border-radius:50%;top:8px;right:9px;border:1px solid #fff}.profile{display:flex;align-items:center;gap:9px;border-left:1px solid var(--line);padding-left:17px}.avatar{width:32px;height:32px;border-radius:50%;background:#d6e3cf;color:var(--olive);display:grid;place-items:center;font-size:11px;font-weight:700}.profile b{font-size:12px}.profile span{display:block;color:var(--muted);font-size:10px;margin-top:1px}
    .page{padding-top:30px}.hero{display:flex;justify-content:space-between;align-items:start;margin-bottom:24px}.eyebrow{display:flex;gap:7px;align-items:center;color:var(--olive);font-size:11px;font-weight:700;letter-spacing:.5px}.live{width:7px;height:7px;border-radius:50%;background:#5caf6b;box-shadow:0 0 0 3px #e8f5e9}.hero h1{font-size:27px;letter-spacing:-1px;margin:9px 0 5px}.hero p{color:var(--muted);margin:0}.date-pill{padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:9px;font-size:12px;color:var(--muted)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.kpi{padding:18px}.kpi-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.kpi-icon{height:28px;width:28px;border-radius:8px;display:grid;place-items:center;background:#eff4e9;color:var(--olive)}.kpi strong{font-size:25px;letter-spacing:-1px;display:block;margin:14px 0 7px}.delta{font-size:11px;color:#3c9762;font-weight:700}.delta span{color:var(--muted);font-weight:400;margin-left:3px}.progress{height:4px;background:#edf0ed;border-radius:5px;margin-top:12px}.progress span{display:block;height:100%;background:var(--olive);border-radius:5px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 13px}.section-head h2{font-size:15px;margin:0;letter-spacing:-.25px}.section-head p{font-size:11px;color:var(--muted);margin:3px 0 0}.link-btn{border:0;background:none;color:var(--olive);font-size:12px;font-weight:700;padding:4px}.order-board{padding:17px;margin-bottom:24px;overflow:auto}.kanban{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:14px}.order-col{background:#f7f8f6;border-radius:10px;padding:10px}.order-col-header{display:flex;justify-content:space-between;align-items:center;padding:2px 3px 11px;font-weight:700;font-size:11px;letter-spacing:.65px}.count{font-size:11px;border-radius:20px;padding:3px 8px;background:#ebeeea;color:#66746c;letter-spacing:0}.new .count{background:#e9f0f8;color:#4b75a0}.preparing .count{background:var(--amber-bg);color:#ae761d}.ready .count{background:#e6f4e8;color:#41844c}.served .count{background:#eeeeee;color:#777}.order-item{background:#fff;border:1px solid #e7ebe7;border-radius:9px;padding:11px;margin-bottom:8px;box-shadow:0 2px 5px rgba(0,0,0,.025)}.order-item:last-child{margin-bottom:0}.order-title{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12px}.order-title span{font-size:10px;color:var(--muted);font-weight:500}.order-item p{font-size:10.5px;line-height:1.55;color:#637069;margin:7px 0}.order-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f1f0;padding-top:8px;font-size:11px;font-weight:700}.move{border:0;background:#eef4ea;color:var(--olive);font-size:10px;font-weight:700;border-radius:5px;padding:5px 7px}.served .move{display:none}
    .grid-2{display:grid;grid-template-columns:1.45fr 1fr;gap:20px;margin-bottom:24px}.analytics{padding:18px 20px}.analytics-stat{display:flex;gap:25px;font-size:11px;color:var(--muted)}.analytics-stat b{display:block;font-size:15px;color:var(--ink);margin-top:3px}.chart{height:187px;margin-top:15px;position:relative;border-bottom:1px solid #e8ece8;background:repeating-linear-gradient(to bottom, transparent 0,transparent 45px,#f0f2ef 46px)}.chart svg{width:100%;height:100%;overflow:visible}.chart-labels{display:flex;justify-content:space-between;color:#9ba49e;font-size:10px;padding-top:8px}.popular{padding:18px 20px}.popular-list{margin-top:10px}.popular-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1f0}.popular-item:last-child{border:0}.rank{background:#f2f4ef;border-radius:6px;width:25px;height:25px;display:grid;place-items:center;color:var(--olive);font-size:11px;font-weight:700}.popular-name{flex:1;font-size:12px;font-weight:600}.popular-orders{font-size:11px;color:var(--muted)}
    .lower{display:grid;grid-template-columns:1.1fr 1fr .95fr;gap:20px}.panel{padding:18px 19px}.tables-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.table-tile{border:1px solid #e7eae7;background:#fff;padding:8px;border-radius:8px;text-align:left;min-height:59px}.table-tile:hover{border-color:#91a993}.table-tile b{display:block;font-size:11px}.table-tile span{font-size:9px;margin-top:4px;display:block}.available{color:#478252}.occupied{color:#b5751e}.reserved{color:#7e699b}.table-tile .amount{color:#7c867f}.menu-list,.device-list,.payment-list{margin-top:9px}.menu-row{padding:9px 0;border-bottom:1px solid #f0f1f0;display:flex;gap:8px;align-items:center}.menu-row:last-child{border:0}.menu-name{font-size:11.5px;font-weight:600;flex:1}.menu-price{font-size:10px;color:var(--muted)}.toggle{border:0;width:29px;height:17px;border-radius:12px;background:#d5d9d6;padding:2px;transition:.2s}.toggle i{display:block;width:13px;height:13px;border-radius:50%;background:white;transition:.2s}.toggle.on{background:#4c9660}.toggle.on i{transform:translateX(12px)}.availability{font-size:9px;font-weight:700;width:49px}.availability.yes{color:#42824d}.availability.no{color:var(--red)}.device-row,.payment-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0f1f0;cursor:pointer}.device-row:last-child,.payment-row:last-child{border:0}.device-icon,.payment-icon{width:25px;height:25px;border-radius:7px;background:#f1f5ee;display:grid;place-items:center;font-size:12px}.device-name,.payment-name{flex:1;font-size:11px;font-weight:600}.device-name small,.payment-name small{display:block;font-size:9px;color:var(--muted);font-weight:400;margin-top:2px}.status{font-size:9px;font-weight:700}.online,.paid{color:#43814e}.offline{color:var(--red)}.method{font-size:9px;color:var(--muted)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(17,30,23,.35);z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(440px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 65px rgba(0,0,0,.2);padding:22px;position:relative}.modal h3{font-size:18px;margin:0 0 4px}.modal-sub{margin:0 0 19px;font-size:12px;color:var(--muted)}.close{position:absolute;right:14px;top:14px;border:0;background:#f3f5f2;width:28px;height:28px;border-radius:8px}.detail-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.detail-row span{color:var(--muted)}.modal select,.modal input{width:100%;margin:7px 0 14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.modal label{font-size:11px;font-weight:700;color:var(--muted)}.primary{border:0;background:var(--olive);color:#fff;border-radius:8px;padding:10px 13px;font-size:12px;font-weight:700;width:100%;margin-top:13px}.toast{position:fixed;right:25px;bottom:24px;background:#1e3026;color:#fff;border-radius:9px;padding:12px 15px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);transform:translateY(80px);opacity:0;transition:.3s;z-index:20}.toast.show{transform:none;opacity:1}.view-placeholder{background:#fff;border:1px solid var(--line);border-radius:15px;padding:60px;text-align:center;color:var(--muted)}.view-placeholder h2{color:var(--ink)}
    @media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr 1fr}.lower>.panel:last-child{grid-column:span 2}.sidebar{width:210px}main{margin-left:210px;width:calc(100% - 210px)}}@media(max-width:760px){.sidebar{width:62px;padding:22px 9px}.brand{padding:0 6px 25px}.brand>div,.nav-label,.nav button span,.side-card{display:none}.nav button{justify-content:center;padding:12px}.nav i{font-size:16px}main{margin-left:62px;width:calc(100% - 62px);padding:0 17px 30px}.topbar{height:70px}.restaurant b{font-size:12px}.clock,.profile>div{display:none}.hero h1{font-size:22px}.date-pill{display:none}.grid-2,.lower{grid-template-columns:1fr}.lower>.panel:last-child{grid-column:auto}.kpis{gap:10px}.kpi{padding:13px}.kpi strong{font-size:20px}.top-actions{gap:8px}.kanban{grid-template-columns:repeat(4,210px)}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar"><div class="brand"><div class="brand-mark">T</div><div>Tablors <small>RESTAURANT OS</small></div></div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav"><button class="active" data-view="Overview"><i>⌂</i><span>Overview</span></button><button data-view="Menu"><i>☷</i><span>Menu</span></button><button data-view="Tables"><i>▦</i><span>Tables</span></button><button data-view="Orders"><i>◫</i><span>Orders</span></button><button data-view="Billing"><i>◈</i><span>Billing</span></button><button data-view="Reports"><i>⌁</i><span>Reports</span></button><button data-view="Digital Menu Cards"><i>▣</i><span>Digital Menu Cards</span></button><button data-view="Settings"><i>⚙</i><span>Settings</span></button></nav><div class="side-card"><b>Need a hand?</b><p>Explore the owner dashboard guide for quick answers.</p><button>Open help center →</button></div></aside>
  <main><header class="topbar"><div class="restaurant"><div class="restaurant-logo">T</div><div><b>Tablors</b><span>Visakhapatnam, Andhra Pradesh</span></div></div><div class="top-actions"><span class="clock" id="clock"></span><button class="icon-button" title="Notifications">♧<i class="dot"></i></button><div class="profile"><div class="avatar">AR</div><div><b>Arjun Rao</b><span>Owner</span></div></div></div></header><div id="content"></div></main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const orders=[{id:1048,table:'05',items:'Pepper Chicken × 2 · Chicken Biryani × 1 · Naan × 3',total:960,time:'12:42 PM',status:'new'},{id:1049,table:'18',items:'Paneer Tikka × 1 · Veg Fried Rice × 2',total:680,time:'12:45 PM',status:'new'},{id:1050,table:'08',items:'Chicken Biryani × 2 · Raita × 2',total:640,time:'12:47 PM',status:'preparing'},{id:1051,table:'14',items:'Fish Fry × 1 · Garlic Naan × 4',total:740,time:'12:48 PM',status:'preparing'},{id:1052,table:'22',items:'Veg Biryani × 2 · Paneer 65 × 1',total:700,time:'12:51 PM',status:'ready'},{id:1047,table:'03',items:'Chicken 65 × 2 · Naan × 2',total:680,time:'12:35 PM',status:'served'}];
const menu=[['Chicken Biryani',280,true],['Pepper Chicken',300,true],['Chicken 65',220,true],['Veg Biryani',240,false],['Garlic Naan',40,true]];
const devices=[['01',true,'82%','OMC-01A9'],['02',true,'64%','OMC-02B4'],['03',false,'Last seen 12m','OMC-03F7'],['04',true,'91%','OMC-04D2'],['05',true,'76%','OMC-05K1'],['06',true,'54%','OMC-06L8'],['07',false,'Last seen 5m','OMC-07P3'],['08',true,'88%','OMC-08X5']];
let tables=Array.from({length:24},(_,i)=>{let n=String(i+1).padStart(2,'0'),s=[1,4,7,10,14,17,20,23].includes(i)?'available':([3,11,19].includes(i)?'reserved':'occupied');let o=orders.find(x=>x.table===n);if(o)s='occupied';return {n,status:s,amount:o?o.total:(s==='occupied'?[540,820,1240,760,450][i%5]:null)}});
const fmt=n=>'₹'+n.toLocaleString('en-IN'); const statusLabel=s=>({new:'NEW',preparing:'PREPARING',ready:'READY',served:'SERVED'})[s];
function overview(){return `<section class="page"><div class="hero"><div><div class="eyebrow"><i class="live"></i> LIVE OPERATIONS</div><h1>Good afternoon, Tablors</h1><p>Here's what's happening in your restaurant today.</p></div><div class="date-pill">◷ &nbsp; Wednesday, 10 September</div></div><div class="kpis"><div class="card kpi"><div class="kpi-top">Today's Sales <span class="kpi-icon">₹</span></div><strong>₹48,650</strong><span class="delta">↑ 12.4% <span>vs. yesterday</span></span></div><div class="card kpi"><div class="kpi-top">Orders <span class="kpi-icon">◫</span></div><strong>186</strong><span class="delta">↑ 8.7% <span>vs. yesterday</span></span></div><div class="card kpi"><div class="kpi-top">Average Order Value <span class="kpi-icon">⌁</span></div><strong>₹262</strong><span class="delta">↑ 4.2% <span>vs. yesterday</span></span></div><div class="card kpi"><div class="kpi-top">Table Occupancy <span class="kpi-icon">▦</span></div><strong>28 <small style="font-size:13px;color:var(--muted);font-weight:500">/ 40</small></strong><span class="delta"><span>70% occupied</span></span><div class="progress"><span style="width:70%"></span></div></div></div><section class="card order-board"><div class="section-head"><div><h2>Live order status</h2><p>Track every order from table to payment.</p></div><button class="link-btn" onclick="showView('Orders')">View all orders →</button></div><div class="kanban">${['new','preparing','ready','served'].map(s=>orderColumn(s)).join('')}</div></section><div class="grid-2"><section class="card analytics"><div class="section-head"><div><h2>Sales analytics</h2><p>Today's performance, updated live</p></div><div class="analytics-stat"><div>Today<b>₹48,650</b></div><div>Yesterday<b>₹43,270</b></div><div>This week<b>₹3.18L</b></div></div></div><div class="chart"><svg viewBox="0 0 700 190" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#86ad69" stop-opacity=".3"/><stop offset="1" stop-color="#86ad69" stop-opacity="0"/></linearGradient></defs><path d="M0 166 L55 158 L110 151 L165 133 L220 109 L275 117 L330 75 L385 94 L440 54 L495 69 L550 27 L605 47 L660 21 L700 38 L700 190 L0 190Z" fill="url(#fill)"/><path d="M0 166 L55 158 L110 151 L165 133 L220 109 L275 117 L330 75 L385 94 L440 54 L495 69 L550 27 L605 47 L660 21 L700 38" fill="none" stroke="#497956" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="660" cy="21" r="5" fill="#fff" stroke="#497956" stroke-width="3"/></svg></div><div class="chart-labels"><span>10 AM</span><span>12 PM</span><span>2 PM</span><span>4 PM</span><span>6 PM</span><span>8 PM</span><span>10 PM</span></div></section><section class="card popular"><div class="section-head"><div><h2>Popular items</h2><p>Most ordered today</p></div><button class="link-btn" onclick="showView('Menu')">Menu →</button></div><div class="popular-list">${[['Chicken Biryani','438'],['Pepper Chicken','281'],['Chicken 65','245'],['Veg Biryani','190'],['Garlic Naan','176']].map((x,i)=>`<div class="popular-item"><span class="rank">${i+1}</span><span class="popular-name">${x[0]}</span><span class="popular-orders">${x[1]} orders</span></div>`).join('')}</div></section></div><div class="lower"><section class="card panel"><div class="section-head"><div><h2>Table overview</h2><p>${tables.filter(t=>t.status==='occupied').length} occupied · ${tables.filter(t=>t.status==='available').length} available</p></div><button class="link-btn" onclick="showView('Tables')">All tables →</button></div><div class="tables-grid">${tables.slice(0,20).map(tableTile).join('')}</div></section><section class="card panel"><div class="section-head"><div><h2>Menu availability</h2><p>Make items live or unavailable instantly</p></div><button class="link-btn" onclick="editMenu()">Edit menu</button></div><div class="menu-list">${menu.map((m,i)=>menuRow(m,i)).join('')}</div></section><section class="card panel"><div class="section-head"><div><h2>Digital menu cards</h2><p>8 devices connected</p></div><button class="link-btn" onclick="showView('Digital Menu Cards')">View all →</button></div><div class="device-list">${devices.slice(0,5).map((d,i)=>deviceRow(d,i)).join('')}</div></section></div></section>`}
function orderColumn(s){let all=orders.filter(o=>o.status===s), total={new:7,preparing:12,ready:5,served:162}[s];return `<div class="order-col ${s}"><div class="order-col-header"><span>${statusLabel(s)}</span><span class="count">${total} orders</span></div>${all.slice(0,2).map(orderCard).join('')||'<div style="font-size:11px;color:#9aa39d;padding:12px 3px">No active orders</div>'}</div>`}
function orderCard(o){let next={new:'preparing',preparing:'ready',ready:'served'}[o.status];return `<div class="order-item" onclick="orderDetail(${o.id})"><div class="order-title"><span>Order #${o.id}</span><span>Table ${o.table}</span></div><p>${o.items}</p><div class="order-footer"><span>${fmt(o.total)}</span>${next?`<button class="move" onclick="event.stopPropagation();moveOrder(${o.id},'${next}')">Mark ${statusLabel(next).toLowerCase()} →</button>`:''}</div></div>`}
function tableTile(t){return `<button class="table-tile" onclick="tableDetail('${t.n}')"><b>Table ${t.n}</b><span class="${t.status}">${t.status[0].toUpperCase()+t.status.slice(1)}</span>${t.amount?`<span class="amount">${fmt(t.amount)}</span>`:''}</button>`}
function menuRow(m,i){return `<div class="menu-row"><div class="menu-name">${m[0]}<span class="menu-price"> · ${fmt(m[1])}</span></div><span class="availability ${m[2]?'yes':'no'}">${m[2]?'AVAILABLE':'UNAVAILABLE'}</span><button class="toggle ${m[2]?'on':''}" onclick="toggleMenu(${i})"><i></i></button></div>`}
function deviceRow(d,i){return `<div class="device-row" onclick="deviceDetail(${i})"><div class="device-icon">▣</div><div class="device-name">Table ${d[0]}<small>${d[2]} battery</small></div><span class="status ${d[1]?'online':'offline'}">${d[1]?'● ONLINE':'● OFFLINE'}</span></div>`}
function showView(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('content').innerHTML=v==='Overview'?overview():`<section class="page"><div class="hero"><div><div class="eyebrow"><i class="live"></i> TABLORS</div><h1>${v}</h1><p>Manage your restaurant's ${v.toLowerCase()} from one place.</p></div></div><div class="view-placeholder"><h2>${v} workspace</h2><p>This presentation demo keeps the full operational snapshot on the Overview screen.<br>Use the navigation to see how modules are organized.</p><button class="primary" style="width:auto" onclick="showView('Overview')">Back to overview</button></div></section>`} 
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2800)}
function moveOrder(id,next){let o=orders.find(x=>x.id===id);o.status=next;showView('Overview');toast(`Order #${id} moved to ${statusLabel(next).toLowerCase()}`)}
function modal(html){document.getElementById('modal').innerHTML=`<button class="close" onclick="closeModal()">×</button>${html}`;document.getElementById('modalBackdrop').classList.add('open')};function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
function orderDetail(id){let o=orders.find(x=>x.id===id);modal(`<h3>Order #${o.id}</h3><p class="modal-sub">Table ${o.table} · Placed at ${o.time}</p><div class="detail-row"><span>Items</span><b style="max-width:220px;text-align:right">${o.items}</b></div><div class="detail-row"><span>Order status</span><b>${statusLabel(o.status)}</b></div><div class="detail-row"><span>Payment</span><b class="paid">PAID</b></div><div class="detail-row"><span>Total</span><b>${fmt(o.total)}</b></div></div>`)}
function tableDetail(n){let t=tables.find(x=>x.n===n),o=orders.find(x=>x.table===n);modal(`<h3>Table ${n}</h3><p class="modal-sub">Current table details</p><div class="detail-row"><span>Current status</span><b class="${t.status}">${t.status.toUpperCase()}</b></div>${o?`<div class="detail-row"><span>Current order</span><b>#${o.id} · ${fmt(o.total)}</b></div><div class="detail-row"><span>Order status</span><b>${statusLabel(o.status)}</b></div><div class="detail-row"><span>Payment</span><b class="paid">PAID</b></div>`:'<div class="detail-row"><span>Current order</span><b>None</b></div>'}<label>Change table status</label><select id="tableStatus"><option value="available">Available</option><option value="occupied">Occupied</option><option value="reserved">Reserved</option></select><button class="primary" onclick="changeTable('${n}')">Save table status</button>`);document.getElementById('tableStatus').value=t.status}
function changeTable(n){let t=tables.find(x=>x.n===n);t.status=document.getElementById('tableStatus').value;if(t.status==='available')t.amount=null;closeModal();showView('Overview');toast(`Table ${n} marked ${t.status}`)}
function toggleMenu(i){menu[i][2]=!menu[i][2];showView('Overview');toast(`${menu[i][0]} marked ${menu[i][2]?'available':'unavailable'}`)}
function editMenu(){modal(`<h3>Edit menu item</h3><p class="modal-sub">Update an item for this demo menu.</p><label>Menu item</label><select id="editItem">${menu.map((m,i)=>`<option value="${i}">${m[0]}</option>`).join('')}</select><label>Price (₹)</label><input id="editPrice" type="number" value="280"><button class="primary" onclick="saveMenuEdit()">Save changes</button>`)}function saveMenuEdit(){let i=+document.getElementById('editItem').value;menu[i][1]=+document.getElementById('editPrice').value;closeModal();showView('Overview');toast(`${menu[i][0]} updated successfully`)}
function deviceDetail(i){let d=devices[i];modal(`<h3>Digital menu card · Table ${d[0]}</h3><p class="modal-sub">Device health and connection information</p><div class="detail-row"><span>Status</span><b class="${d[1]?'online':'offline'}">${d[1]?'ONLINE':'OFFLINE'}</b></div><div class="detail-row"><span>Battery</span><b>${d[2]}</b></div><div class="detail-row"><span>Device ID</span><b>${d[3]}</b></div><div class="detail-row"><span>Last connected</span><b>${d[1]?'Just now':d[2].replace('Last seen ','ago')}</b></div><div class="detail-row"><span>Firmware version</span><b>v2.4.1</b></div>`)}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button');if(b)showView(b.dataset.view)});document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});function tick(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('en-IN',{weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())} tick();setInterval(tick,1000);showView('Overview');
</script>
</body></html>
